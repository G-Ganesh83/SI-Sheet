<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SI Sheet</title>
    <meta
      name="description"
      content="Clean, premium, personal DSA problem tracker for Smart Interviews and LeetCode lab sessions with topic categorization, revision queue, and local persistence."
    />
    <meta name="theme-color" content="#08060d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Inline theme init: apply saved theme before React hydration to prevent FOUC -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("dsa-lab-tracker:v1");
          if (stored) {
            var parsed = JSON.parse(stored);
            var theme = parsed && parsed.theme === "light" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", theme);
            if (theme === "dark") {
              document.documentElement.classList.add("dark");
            } else {
              document.documentElement.classList.remove("dark");
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
